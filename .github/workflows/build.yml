name: Mesa Intel for Bazzite

on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:
    inputs:
      ref:
        description: Mesa ref (branch, tag or commit)
        default: main

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[repack]') }}
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:45
    env:
      REF: ${{ github.event.inputs.ref || (startsWith(github.ref, 'refs/heads/ci/mesa-26.3.1') && 'mesa-26.3.1') || 'main' }}
    steps:
    - uses: actions/checkout@v4
    - name: Dependencies (Fedora's own Mesa build dependencies)
      run: |
        dnf -y install dnf-plugins-core git
        dnf -y builddep mesa
    - name: Source
      run: |
        git init -q src && cd src
        git remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
        git fetch -q --depth 1 origin "$REF"
        git checkout -q FETCH_HEAD
        git log -1 --format='%H %cd %s' | tee ../mesa-rev.txt
        for p in ../patches/*.patch; do
          [ -f "$p" ] || continue
          git apply --verbose "$p" && echo "patched: $(basename "$p")" | tee -a ../mesa-rev.txt
        done
    - name: Configure
      run: |
        meson setup build src -Dprefix=/usr -Dlibdir=lib64 -Dbuildtype=release \
          -Dvulkan-drivers=intel -Dgallium-drivers= -Dtools=intel -Dvideo-codecs= \
          -Dplatforms=x11,wayland -Dopengl=false -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled
    - name: Build
      run: meson compile -C build
    - name: Install and pack
      run: |
        DESTDIR=$PWD/out meson install -C build >/dev/null
        cp mesa-rev.txt out/
        tar czf mesa-intel.tgz -C out .
    - uses: actions/upload-artifact@v4
      with:
        name: mesa-intel-${{ env.REF }}
        path: mesa-intel.tgz

  rpm:
    if: ${{ startsWith(github.ref, 'refs/heads/ci/mesa-') && !contains(github.event.head_commit.message, '[repack]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i386]
    container:
      image: registry.fedoraproject.org/fedora:45
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - name: Tools
      run: |
        dnf -y install mock rpm-build rpmdevtools
        useradd -G mock builder
    - name: Sources
      run: |
        mkdir -p sources
        cp rpm/mesa.spec rpm/*.patch rpm/*.txt sources/
        spectool -g -C sources rpm/mesa.spec
        chown -R builder sources
    - name: Build
      run: |
        mkdir -p results && chown builder results
        su builder -c "mock -r fedora-45-${{ matrix.arch }} --isolation=simple --resultdir=results --spec sources/mesa.spec --sources sources --buildsrpm"
        su builder -c "mock -r fedora-45-${{ matrix.arch }} --isolation=simple --resultdir=results --rebuild results/mesa-*.src.rpm"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mesa-rpm-${{ matrix.arch }}
        path: results/

  repack:
    if: ${{ contains(github.event.head_commit.message, '[repack]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        arch: [x86_64, i386]
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: mesa-rpm-${{ matrix.arch }}
        path: all
        run-id: 46032263271
        github-token: ${{ github.token }}
    - name: Keep the packages the image installs
      run: |
        mkdir keep
        for p in dri-drivers filesystem libEGL libgbm libGL vulkan-drivers; do
          cp all/mesa-$p-26.3.1-*.rpm keep/
        done
        rm -f keep/*debuginfo* keep/*devel*
        ls -la keep; (cd keep && sha256sum *.rpm | tee SHA256SUMS)
    - uses: actions/upload-artifact@v4
      with:
        name: mesa-rpm-slim-${{ matrix.arch }}
        path: keep
